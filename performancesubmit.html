<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Input Program & Foto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .brutal-card { border: 3px solid #000; box-shadow: 5px 5px 0px #000; }
    </style>
</head>
<body class="bg-[#f4f4f5] text-gray-900 font-sans p-4 sm:p-8 min-h-screen flex items-center justify-center">

    <div class="w-full max-w-lg bg-white brutal-card p-6 sm:p-8 rounded-xl">
        <div class="mb-6 border-b-4 border-black pb-3">
            <h1 class="text-2xl sm:text-3xl font-black uppercase">Form Program Acara</h1>
            <p class="text-xs sm:text-sm font-bold text-gray-600 mt-1">Input data & foto penampil langsung ke Drive/Spreadsheet</p>
        </div>

        <div id="statusAlert" class="hidden mb-6 p-4 rounded-lg border-2 border-black font-bold text-sm"></div>

        <form id="programForm" class="space-y-4">
            <div>
                <label class="block font-black text-sm uppercase mb-1">Nama Penampil</label>
                <input type="text" id="namaPenampil" required placeholder="Contoh: Band Akustik" class="w-full border-2 border-black p-2.5 rounded-lg font-semibold focus:outline-none focus:bg-yellow-100">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block font-black text-sm uppercase mb-1">Hari (Day)</label>
                    <select id="day" required class="w-full border-2 border-black p-2.5 rounded-lg font-semibold focus:outline-none focus:bg-yellow-100">
                        <option value="" disabled selected>-- Pilih Day --</option>
                        <option value="Day 1">Day 1</option>
                        <option value="Day 2">Day 2</option>
                        <option value="Day 3">Day 3</option>
                        <option value="Day 4">Day 4</option>
                        <option value="Day 5">Day 5</option>
                    </select>
                </div>
                <div>
                    <label class="block font-black text-sm uppercase mb-1">Tgl Program</label>
                    <input type="date" id="tglProgram" required class="w-full border-2 border-black p-2.5 rounded-lg font-semibold focus:outline-none focus:bg-yellow-100">
                </div>
            </div>

            <div>
                <label class="block font-black text-sm uppercase mb-1">Waktu / Jam Program</label>
                <div class="grid grid-cols-2 gap-3">
                    <input type="time" id="jamMulai" required class="w-full border-2 border-black p-2.5 rounded-lg font-semibold focus:outline-none focus:bg-yellow-100">
                    <input type="time" id="jamSelesai" required class="w-full border-2 border-black p-2.5 rounded-lg font-semibold focus:outline-none focus:bg-yellow-100">
                </div>
            </div>

            <!-- Input Upload Foto -->
            <div>
                <label class="block font-black text-sm uppercase mb-1">Foto Penampil (Opsional)</label>
                <input type="file" id="fotoInput" accept="image/*" class="w-full border-2 border-black p-2 rounded-lg font-semibold bg-gray-50 text-sm">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-yellow-300 hover:bg-yellow-400 text-black font-black border-2 border-black p-3 rounded-lg shadow-[3px_3px_0px_#000]">
                🚀 SIMPAN DATA & FOTO
            </button>
        </form>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbz5H4qVnDwPUWEJnortcTFgBrBNabpTuGXtuC70vmCGYZgMP_h19gCQCs_gOfxsp2965A/exec';

        const form = document.getElementById('programForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusAlert = document.getElementById('statusAlert');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.innerText = '⏳ Mengunggah foto & data...';
            statusAlert.classList.add('hidden');

            const fileInput = document.getElementById('fotoInput');
            let fotoData = null, fotoName = null, fotoType = null;

            // Jika ada file foto yang dipilih, konversi ke Base64
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                fotoName = file.name;
                fotoType = file.type;
                fotoData = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result.split(',')[1]);
                    reader.readAsDataURL(file);
                });
            }

            const payload = {
                namaPenampil: document.getElementById('namaPenampil').value,
                day: document.getElementById('day').value,
                tglProgram: document.getElementById('tglProgram').value,
                jamMulai: document.getElementById('jamMulai').value,
                jamSelesai: document.getElementById('jamSelesai').value,
                fotoData: fotoData,
                fotoName: fotoName,
                fotoType: fotoType
            };

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(() => {
                statusAlert.className = 'mb-6 p-4 rounded-lg border-2 border-black font-bold text-sm bg-green-300 text-black';
                statusAlert.innerText = '✅ Data dan foto berhasil disimpan!';
                statusAlert.classList.remove('hidden');

                form.reset();
                submitBtn.disabled = false;
                submitBtn.innerText = '🚀 SIMPAN DATA & FOTO';
            })
            .catch(error => {
                statusAlert.className = 'mb-6 p-4 rounded-lg border-2 border-black font-bold text-sm bg-red-300 text-black';
                statusAlert.innerText = '❌ Gagal mengunggah data. Coba lagi!';
                statusAlert.classList.remove('hidden');

                submitBtn.disabled = false;
                submitBtn.innerText = '🚀 SIMPAN DATA & FOTO';
            });
        });
    </script>
</body>
</html>
