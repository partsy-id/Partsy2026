<form id="rundownForm">
  <div>
    <label for="namaProgram">Nama Program:</label><br>
    <input type="text" id="namaProgram" placeholder="Contoh: Workshop UI/UX" required>
  </div>

  <br>
  <div>
    <label for="hari">Hari (Day):</label><br>
    <select id="hari" required>
      <option value="">-- Pilih Hari --</option>
      <option value="Day 1">Day 1</option>
      <option value="Day 2">Day 2</option>
      <option value="Day 3">Day 3</option>
      <option value="Day 4">Day 4</option>
      <option value="Day 5">Day 5</option>
    </select>
  </div>

  <br>
  <div>
    <label for="tanggal">Tanggal:</label><br>
    <input type="date" id="tanggal" required>
  </div>

  <br>
  <div>
    <label for="jamMulai">Jam Mulai:</label><br>
    <input type="time" id="jamMulai" required>
  </div>

  <br>
  <div>
    <label for="jamSelesai">Jam Berakhir:</label><br>
    <input type="time" id="jamSelesai" required>
  </div>

  <br>
  <div>
    <label for="gambar">Upload Gambar Rundown / Banner:</label><br>
    <input type="file" id="gambar" accept="image/*" required>
  </div>

  <br>
  <button type="submit" id="btnSubmit">Kirim Rundown</button>
</form>

<script>
  const scriptURL = 'https://script.google.com/macros/s/AKfycbwu3wLX7lzLaerfCJZnrEBl_RmCol55joKOGuLcS-3DV9kyx3yBh9gB67bAZCY7NkHjmg/exec'; // Ganti dengan URL Web App Apps Script

  document.getElementById('rundownForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const btn = document.getElementById('btnSubmit');
    btn.disabled = true;
    btn.innerText = 'Mengirim...';

    const fileInput = document.getElementById('gambar');
    const file = fileInput.files[0];
    const reader = new FileReader();
    
    reader.onload = function(evt) {
      const payload = {
        namaProgram: document.getElementById('namaProgram').value,
        hari: document.getElementById('hari').value,
        tanggal: document.getElementById('tanggal').value,
        jamMulai: document.getElementById('jamMulai').value,
        jamSelesai: document.getElementById('jamSelesai').value,
        fileName: file.name,
        fileData: evt.target.result
      };
      
      fetch(scriptURL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(response => {
        if(response.result === 'success') {
          alert('Data rundown berhasil disimpan!');
          document.getElementById('rundownForm').reset();
        } else {
          alert('Gagal menyimpan data: ' + response.error);
        }
      })
      .catch(error => {
        console.error('Error!', error.message);
        alert('Terjadi kesalahan saat mengunggah data.');
      })
      .finally(() => {
        btn.disabled = false;
        btn.innerText = 'Kirim Rundown';
      });
    };
    
    reader.readAsDataURL(file);
  });
</script>
