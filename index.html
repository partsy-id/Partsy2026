<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partsy 2026</title>
    
    <!-- Memuat Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Mengimpor font geometris -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Isometra:wght@700&display=swap');
        
        body {
            font-family: 'Space Grotesk', sans-serif;
        }

        /* Latar belakang grid khas Neo-Brutalism */
        .bg-grid-pattern {
            background-color: #f8f9fa; /* Warna dasar off-white terang */
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.15) 1px, transparent 1px);
            background-size: 40px 40px; /* Ukuran kotak grid */
            background-position: center center;
        }
    </style>

    <!-- Custom class Tailwind untuk efisiensi tombol -->
    <style type="text/tailwindcss">
        @layer components {
            .btn-brutal {
                @apply block w-full text-center px-4 py-4 md:px-8 md:py-6 
                       text-black text-lg md:text-xl tracking-wide uppercase 
                       border-2 md:border-4 border-black 
                       shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] md:shadow-[10px_10px_0px_0px_rgba(0,0,0,1)] 
                       transition-all duration-150 ease-in-out;
            }
            .btn-brutal:hover {
                @apply translate-x-[2px] translate-y-[2px] shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] 
                       md:translate-x-[4px] md:translate-y-[4px] md:shadow-[6px_6px_0px_0px_rgba(0,0,0,1)];
            }
            .btn-brutal:active {
                @apply translate-x-[6px] translate-y-[6px] shadow-none 
                       md:translate-x-[10px] md:translate-y-[10px];
            }
        }
    </style>
</head>
<body class="bg-grid-pattern min-h-screen flex flex-col items-center justify-center p-6 m-0 overflow-x-hidden">

    <!-- Kontainer Utama -->
    <div class="w-full max-w-4xl mx-auto">
        
        <!-- Header Judul -->
        <div class="text-center mb-10">
            <!-- Label kecil / Badge (Opsional untuk estetika tambahan) -->
            <span class="inline-block bg-black text-white px-3 py-1 text-sm md:text-base font-bold uppercase tracking-widest mb-3 shadow-[4px_4px_0px_0px_#4ade80]">
                Sistem Portal
            </span>
            <h1 class="text-4xl md:text-6xl font-bold text-black uppercase tracking-wider mb-2 drop-shadow-[4px_4px_0_rgba(0,0,0,1)]">
                PARTSY 2026
            </h1>
        </div>

        <!-- Grid untuk 6 Tombol -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">
            
            <!-- Tombol 1: Hijau -->
            <a href="https://github.com/KOLUS-STUDIO" class="btn-brutal bg-[#4ade80]">
                GitHub Utama
            </a>

            <!-- Tombol 2: Biru -->
            <a href="#" class="btn-brutal bg-[#60a5fa]">
                Dokumentasi
            </a>

            <!-- Tombol 3: Hijau -->
            <a href="#" class="btn-brutal bg-[#4ade80]">
                Aset Visual
            </a>

            <!-- Tombol 4: Biru -->
            <a href="#" class="btn-brutal bg-[#60a5fa]">
                Repositori Modul
            </a>

            <!-- Tombol 5: Hijau -->
            <a href="#" class="btn-brutal bg-[#4ade80]">
                Pengaturan
            </a>

            <!-- Tombol 6: Biru -->
            <a href="#" class="btn-brutal bg-[#60a5fa]">
                Kontak Dukungan
            </a>

        </div>
    </div>

</body>
</html>
