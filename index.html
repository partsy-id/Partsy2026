<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partsy 2026</title>
    
    <!-- Memuat Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Mengimpor font geometris -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&display=swap');
        
        body {
            font-family: 'Space Grotesk', sans-serif;
        }

        /* Latar belakang grid khas Neo-Brutalism */
        .bg-grid-pattern {
            background-color: #f8f9fa;
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.15) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center center;
        }

        /* Trik CSS untuk membuat efek Isometrik / 3D Extrusion pada teks */
        .text-isometric {
            color: #60a5fa; /* Warna Biru Utama pada teks */
            /* Outline hitam tipis untuk mempertegas bentuk */
            -webkit-text-stroke: 2px black;
            
            /* Tumpukan bayangan untuk membentuk sisi 3D */
            text-shadow: 
                1px 1px 0 #000,
                2px 2px 0 #000,
                3px 3px 0 #000,
                4px 4px 0 #000,
                5px 5px 0 #000,
                6px 6px 0 #000,
                7px 7px 0 #000,
                8px 8px 0 #000,
                9px 9px 0 #000,
                10px 10px 0 #000,
                11px 11px 0 #000,
                12px 12px 0 #000,
                13px 13px 0 #000;
        }
        
        /* Penyesuaian ketebalan isometrik untuk layar kecil */
        @media (max-width: 768px) {
            .text-isometric {
                -webkit-text-stroke: 1px black;
                text-shadow: 
                    1px 1px 0 #000,
                    2px 2px 0 #000,
                    3px 3px 0 #000,
                    4px 4px 0 #000,
                    5px 5px 0 #000,
                    6px 6px 0 #000,
                    7px 7px 0 #000,
                    8px 8px 0 #000;
            }
        }
    </style>

    <!-- Custom class Tailwind untuk efisiensi tombol -->
    <style type="text/tailwindcss">
        @layer components {
            .btn-brutal {
                @apply block w-full text-center px-4 py-4 md:px-8 md:py-6 
                       text-black text-lg md:text-xl tracking-wide uppercase font-bold
                       border-2 md:border-4 border-black 
                       shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] md:shadow-[10px_10px_0px_0px_rgba(0,0,0,1)] 
                       transition-all duration-150 ease-in-out;
            }
            .btn-brutal:hover {
                @apply translate-x-[2px] translate-y-[2px] shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] 
                       md:translate-x-[4px] md:translate-y-[4px] md:shadow-[6px_6px_0px_0px_rgba(0,0,0,1)];
            }
            .btn-brutal:active {
                @apply translate-x-[6px] translate-y-[6px] shadow-none 
                       md:translate-x-[10px] md:translate-y-[10px];
            }
        }
    </style>
</head>
<body class="bg-grid-pattern min-h-screen flex flex-col items-center justify-center p-6 m-0 overflow-x-hidden">

    <!-- Kontainer Utama -->
    <div class="w-full max-w-4xl mx-auto">
        
        <!-- Header Judul -->
        <div class="text-center mb-12">
            <!-- Badge -->
            <span class="inline-block bg-black text-white px-3 py-1 text-sm md:text-base font-bold uppercase tracking-widest mb-4 shadow-[4px_4px_0px_0px_#4ade80]">
                Sistem Portal
            </span>
            
            <!-- Judul Isometrik -->
            <!-- Menggunakan font-black (weight 900) agar efek 3D lebih terlihat -->
            <h1 class="text-5xl md:text-7xl lg:text-8xl font-black uppercase tracking-wider mb-2 text-isometric transform -rotate-2">
                PARTSY 2026
            </h1>
        </div>

        <!-- Grid untuk 6 Tombol -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">
            
            <a href="https://partsy-id.github.io/Partsy2026/livesubmit" class="btn-brutal bg-[#4ade80]">
                List Seniman
            </a>

            <a href="#" class="btn-brutal bg-[#60a5fa]">
                Dokumentasi
            </a>

            <a href="#" class="btn-brutal bg-[#4ade80]">
                Aset Visual
            </a>

            <a href="#" class="btn-brutal bg-[#60a5fa]">
                Repositori Modul
            </a>

            <a href="#" class="btn-brutal bg-[#4ade80]">
                Pengaturan
            </a>

            <a href="#" class="btn-brutal bg-[#60a5fa]">
                Kontak Dukungan
            </a>

        </div>
    </div>

</body>
</html>
