<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOLUS STUDIO - Hub Links</title>
    <!-- Memuat Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Mengimpor font geometris -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap');
        body {
            font-family: 'Space Grotesk', sans-serif;
        }
    </style>

    <!-- Membuat custom class Tailwind untuk efisiensi kode HTML -->
    <style type="text/tailwindcss">
        @layer components {
            .btn-brutal {
                @apply block w-full text-center px-4 py-4 md:px-8 md:py-6 
                       text-black text-lg md:text-xl tracking-wide uppercase 
                       border-2 md:border-4 border-black 
                       shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] md:shadow-[10px_10px_0px_0px_rgba(0,0,0,1)] 
                       transition-all duration-150 ease-in-out;
            }
            .btn-brutal:hover {
                @apply translate-x-[2px] translate-y-[2px] shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] 
                       md:translate-x-[4px] md:translate-y-[4px] md:shadow-[6px_6px_0px_0px_rgba(0,0,0,1)];
            }
            .btn-brutal:active {
                @apply translate-x-[6px] translate-y-[6px] shadow-none 
                       md:translate-x-[10px] md:translate-y-[10px];
            }
        }
    </style>
</head>
<body class="bg-[#f4ebd0] min-h-screen flex flex-col items-center justify-center p-6 m-0 overflow-x-hidden">

    <!-- Kontainer Utama -->
    <div class="w-full max-w-4xl mx-auto">
        
        <!-- Judul Halaman (Opsional) -->
        <div class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-bold text-black uppercase tracking-wider mb-2 drop-shadow-[3px_3px_0_rgba(0,0,0,1)]">
                KOLUS STUDIO
            </h1>
            <p class="text-lg md:text-xl font-bold border-b-4 border-black inline-block pb-1">
                Direktori Tautan
            </p>
        </div>

        <!-- Grid untuk 6 Tombol -->
        <!-- grid-cols-1 untuk HP, md:grid-cols-2 untuk Tablet/Desktop -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">
            
            <!-- Tombol 1: Merah/Pink -->
            <a href="https://github.com/KOLUS-STUDIO" class="btn-brutal bg-[#ff5757]">
                GitHub Studio
            </a>

            <!-- Tombol 2: Kuning -->
            <a href="#" class="btn-brutal bg-[#fde047]">
                Portofolio Web
            </a>

            <!-- Tombol 3: Cyan -->
            <a href="#" class="btn-brutal bg-[#67e8f9]">
                Komisi & Klien
            </a>

            <!-- Tombol 4: Hijau -->
            <a href="#" class="btn-brutal bg-[#86efac]">
                Katalog Ilustrasi
            </a>

            <!-- Tombol 5: Oranye -->
            <a href="#" class="btn-brutal bg-[#fb923c]">
                Instagram
            </a>

            <!-- Tombol 6: Ungu -->
            <a href="#" class="btn-brutal bg-[#d8b4fe]">
                Hubungi Saya
            </a>

        </div>
    </div>

</body>
</html>
